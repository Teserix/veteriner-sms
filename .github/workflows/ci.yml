name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Testler
        run: npm test

  docker:
    name: Docker imajı derlenir mi
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: İmajı derle (push yok)
        run: docker build -t veteriner-sms:ci .

      - name: İmaj ayağa kalkıyor mu
        run: |
          docker run -d --name vsms -p 3000:3000 \
            -e APP_SECRET=$(head -c 48 /dev/urandom | base64 | tr -d '\n') \
            -e APP_ORIGIN=http://localhost:3000 \
            veteriner-sms:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "Sağlıklı."
              V=$(curl -fsS http://localhost:3000/api/version); echo "$V"
              echo "$V" | jq -e '.name == "veteriner-sms" and .buildTime != "unknown"' >/dev/null || { echo "::error::/api/version beklenen içerikte değil (BUILD_TIME imaja yazılmamış?)"; exit 1; }
              exit 0
            fi
            sleep 2
          done
          echo "::error::Konteyner 40 sn içinde yanıt vermedi"
          docker logs vsms
          exit 1

      - name: Temizlik
        if: always()
        run: docker rm -f vsms >/dev/null 2>&1 || true
